name: release

on:
  push:
    tags:
      - "0.9.*"
      - "0.10.*"
      - "1.0.*"
    branches: []
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist on origin)"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source-verify:
    name: source-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: install dependencies
        run: npm ci --no-audit --no-fund
      - name: vendor-sync
        run: node scripts/vendor-sync.mjs
      - name: format-check
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
      - name: test
        run: npm run test
      - name: clean-tree assertion
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::workspace has uncommitted changes"
            git status --porcelain
            exit 2
          fi

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: source-verify
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: install dependencies
        run: npm ci --no-audit --no-fund
      - name: compute version and tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg_version="$(node -p "require('./package.json').version")"
          expected_tag="${pkg_version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${pkg_version}" >> "$GITHUB_OUTPUT"
      - name: pack
        id: pack
        run: |
          mkdir -p dist-pkg
          npm pack --pack-destination dist-pkg --json
          ver="$(node -p "require('./package.json').version")"
          mv "dist-pkg/opencode-ship-${ver}.tgz" "dist-pkg/opencode-ship-${ver}.tarball"
          tarball="dist-pkg/opencode-ship-${ver}.tarball"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "tarball_name=$(basename ${tarball})" >> "$GITHUB_OUTPUT"
      - name: SHA-256
        run: |
          ver="$(node -p "require('./package.json').version")"
          sha256sum "dist-pkg/opencode-ship-${ver}.tarball" > "dist-pkg/opencode-ship-${ver}.tarball.sha256"
      - name: SPDX SBOM
        run: |
          ver="$(node -p "require('./package.json').version")"
          node scripts/regen-notices.mjs
          cat > "dist-pkg/opencode-ship-${ver}.spdx.json" <<EOF
          {"spdxVersion":"SPDX-2.3","SPDXID":"SPDXRef-DOCUMENT","name":"opencode-ship-${ver}","versionInfo":"${ver}","packages":[{"SPDXID":"SPDXRef-Package","name":"opencode-ship","versionInfo":"${ver}","licenseDeclared":"MIT"}]}
          EOF
      - name: upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack
          path: dist-pkg/
          retention-days: 14

  consumer-install:
    name: consumer-install
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download pack
        uses: actions/download-artifact@v4
        with:
          name: pack
          path: dist-pkg/
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: npm exec init
        run: |
          tarball="$(ls dist-pkg/opencode-ship-*.tarball | head -1)"
          mkdir -p /tmp/consumer-npm
          pushd /tmp/consumer-npm
          git init -q --initial-branch main
          git config user.email "ci@local"
          git config user.name "ci"
          echo "# c" > README.md
          git add . && git commit -qm init
          npm exec --yes --package="$tarball" -- opencode-ship init --json
          test -f .opencode/ship.lock.json
          popd
      - name: pnpm dlx init (engineering)
        run: |
          tarball="$(ls dist-pkg/opencode-ship-*.tarball | head -1)"
          mkdir -p /tmp/consumer-pnpm
          pushd /tmp/consumer-pnpm
          git init -q --initial-branch main
          git config user.email "ci@local"
          git config user.name "ci"
          echo "# c" > README.md
          git add . && git commit -qm init
          mkdir -p .opencode
          cat > .opencode/ship.config.json <<EOF
          {
            "schemaVersion": 2,
            "profile": "engineering",
            "workflow": {
              "models": {
                "planner": "fake/strong-planner",
                "builder": "fake/cheap-builder",
                "finalReviewer": "fake/strong-reviewer"
              }
            }
          }
          EOF
          pnpm dlx --package="$tarball" opencode-ship init --json --profile engineering
          test -f .opencode/ship.lock.json
          popd

  consumer-transitions:
    name: consumer-transitions
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download pack
        uses: actions/download-artifact@v4
        with:
          name: pack
          path: dist-pkg/
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: upgrade + downgrade + uninstall
        run: |
          tarball="$(ls dist-pkg/opencode-ship-*.tarball | head -1)"
          mkdir -p /tmp/consumer-tr
          pushd /tmp/consumer-tr
          git init -q --initial-branch main
          git config user.email "ci@local"
          git config user.name "ci"
          echo "# c" > README.md
          git add . && git commit -qm init
          # core init
          npm exec --yes --package="$tarball" -- opencode-ship init --json
          # upgrade to engineering
          mkdir -p .opencode
          cat > .opencode/ship.config.json <<EOF
          {
            "schemaVersion": 2,
            "profile": "engineering",
            "workflow": {
              "models": {
                "planner": "fake/strong-planner",
                "builder": "fake/cheap-builder",
                "finalReviewer": "fake/strong-reviewer"
              }
            }
          }
          EOF
          npm exec --yes --package="$tarball" -- opencode-ship init --json --profile engineering
          # downgrade
          npm exec --yes --package="$tarball" -- opencode-ship init --json --profile core
          # uninstall
          npm exec --yes --package="$tarball" -- opencode-ship uninstall --json
          test ! -f .opencode/ship.lock.json
          popd

  workflow-e2e:
    name: workflow-e2e
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download pack
        uses: actions/download-artifact@v4
        with:
          name: pack
          path: dist-pkg/
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: workflow e2e
        run: node --test --test-concurrency=1 tests/package/two-task-workflow.test.mjs

  opencode-compat:
    name: opencode-compat
    runs-on: ubuntu-latest
    needs: [source-verify, pack]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        opencode: ["1.15.5", "1.18.10"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: install opencode
        run: npm install --no-save --no-audit --no-fund "@opencode-ai/plugin@${MATRIX_OPENCODE}"
        env:
          MATRIX_OPENCODE: ${{ matrix.opencode }}
      - name: plugin load test
        run: node --test --test-concurrency=1 tests/plugin/plugin-load.test.mjs

  node-compat:
    name: node-compat
    runs-on: ubuntu-latest
    needs: [source-verify, pack]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.6.0", "22", "24"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install dependencies
        run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test

  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download pack
        uses: actions/download-artifact@v4
        with:
          name: pack
          path: dist-pkg/
      - name: validate tag and lock
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          expected_tag="${pkg_version}"
          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "::error::tag (${tag}) does not match package.json version (${pkg_version})"
            exit 2
          fi
          if [[ "${pkg_version}" != "${lock_version}" ]]; then
            echo "::error::package.json (${pkg_version}) != package-lock.json (${lock_version})"
            exit 2
          fi
      - name: ensure tag is merged into main
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/main; then
            echo "tag is reachable from origin/main"
          else
            echo "::error::tag ${GITHUB_REF_NAME} is not reachable from origin/main; merge first"
            exit 2
          fi
      - name: validate pins
        run: |
          node scripts/validate-pins.mjs
      - name: validate placeholder absence
        run: |
          if grep -rIl -E "PLACEHOLDER|TODO|FIXME" src/ assets/ vendor/ 2>/dev/null; then
            echo "::error::placeholder markers found in shipped assets"
            exit 2
          fi

  qualification-report:
    name: qualification-report
    runs-on: ubuntu-latest
    needs: [source-verify, pack, consumer-install, consumer-transitions, workflow-e2e, opencode-compat, node-compat, release-policy]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download pack
        uses: actions/download-artifact@v4
        with:
          name: pack
          path: dist-pkg/
      - name: compose report
        run: |
          ver="$(node -p "require('./package.json').version")"
          sha="$(git rev-parse HEAD)"
          tarball="$(ls dist-pkg/opencode-ship-${ver}.tarball | head -1)"
          tarball_sha="$(sha256sum ${tarball} | awk '{print $1}')"
          tarball_size="$(stat -c %s ${tarball})"
          cat > "dist-pkg/opencode-ship-${ver}.qualification.json" <<EOF
          {
            "schemaVersion": 1,
            "tag": "${GITHUB_REF_NAME}",
            "sourceTagSha": "${sha}",
            "toolVersion": "${ver}",
            "tarball": {
              "name": $(basename ${tarball} | jq -R .),
              "sha256": "${tarball_sha}",
              "size": ${tarball_size}
            },
            "npm": {
              "integrity": "sha512-$(sha512sum ${tarball} | awk '{print $1}')"
            },
            "github": {
              "assetDigest": "sha256-${tarball_sha}",
              "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "evidence": {
              "sourceVerify": "${{ needs.source-verify.result }}",
              "pack": "${{ needs.pack.result }}",
              "consumerInstall": "${{ needs.consumer-install.result }}",
              "consumerTransitions": "${{ needs.consumer-transitions.result }}",
              "workflowE2e": "${{ needs.workflow-e2e.result }}",
              "opencodeCompat": "${{ needs.opencode-compat.result }}",
              "nodeCompat": "${{ needs.node-compat.result }}",
              "releasePolicy": "${{ needs.release-policy.result }}"
            }
          }
          EOF
      - name: upload qualification report
        uses: actions/upload-artifact@v4
        with:
          name: qualification-report
          path: "dist-pkg/opencode-ship-*.qualification.json"

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [source-verify, pack, consumer-install, consumer-transitions, workflow-e2e, opencode-compat, node-compat, release-policy, qualification-report]
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download pack
        uses: actions/download-artifact@v4
        with:
          name: pack
          path: dist-pkg/
      - name: download qualification report
        uses: actions/download-artifact@v4
        with:
          name: qualification-report
          path: dist-pkg/
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: install npm with trusted publishing
        run: npm install --global npm@11.5.2
      - name: validate tag and package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "${tag}" != "v${pkg_version}" && "${tag}" != "${pkg_version}" ]]; then
            echo "::error::tag (${tag}) does not match package.json version (${pkg_version})"
            exit 2
          fi
      - name: check npm version is unused
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "opencode-ship@${pkg_version}" version 2>/dev/null; then
            echo "::error::npm already has opencode-ship@${pkg_version}"
            exit 2
          fi
      - name: publish to npm
        run: |
          set -euo pipefail
          tarball="$(ls dist-pkg/opencode-ship-*.tarball | head -1)"
          # Use the ./ prefix so npm 11.5.2's npa parser treats the
          # argument as a local file tarball.
          npm publish "./${tarball}" --access public --provenance
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: opencode-ship ${{ github.ref_name }}
          body: |
            ## opencode-ship ${{ steps.meta.outputs.pkg_version }}

            npm-distributed OpenCode installer and delivery plugin.

            ### Install

            ```sh
            pnpm dlx opencode-ship@${{ steps.meta.outputs.pkg_version }} init
            ```

            ### Evidence

            See the workflow run for the full qualification report.
          files: |
            dist-pkg/opencode-ship-*.tarball
            dist-pkg/opencode-ship-*.tarball.sha256
            dist-pkg/opencode-ship-*.spdx.json
            dist-pkg/opencode-ship-*.qualification.json