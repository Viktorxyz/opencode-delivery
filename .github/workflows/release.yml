name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: opencode-ship tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install dependencies
        run: npm ci --no-audit --no-fund

      - name: verify
        run: npm run verify

      - name: packed-artifact smoke
        run: npm run test:package

      - name: pack
        id: pack
        run: |
          set -euo pipefail
          version="$(node -e 'console.log(require("./package.json").version)')"
          tag="v${version}"
          mkdir -p dist-pkg
          npm pack --pack-destination dist-pkg
          tarball="dist-pkg/opencode-ship-${version}.tgz"
          mv -v "$tarball" "dist-pkg/${tag}.tgz" || cp -v "$tarball" "dist-pkg/${tag}.tgz"
          echo "package-version=${version}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist-pkg/${tag}.tgz" >> "$GITHUB_OUTPUT"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: opencode-ship ${{ github.ref_name }}
          body: |
            ## opencode-ship ${{ steps.pack.outputs.package-version }}

            npm-distributed OpenCode installer and delivery plugin. See
            `README.md` and `CHANGELOG.md` for the full release notes.

            ### Install

            ```sh
            pnpm dlx opencode-ship@latest init
            ```

            Once npm releases this tag, the same command works against the
            public registry. For tarball-only installs:

            ```sh
            pnpm dlx --package=https://github.com/Viktorxyz/opencode-ship/releases/download/${{ github.ref_name }}/opencode-ship-${{ steps.pack.outputs.package-version }}.tgz opencode-ship init
            ```
          files: |
            dist-pkg/${{ github.ref_name }}.tgz
            dist/plugin.js
            dist/cli.js
            dist/core.js
            dist/plugin.d.ts
            dist/cli.d.ts
            dist/core.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
